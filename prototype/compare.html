<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANGLE / 变画对照</title><style>*{box-sizing:border-box}body{margin:0;background:#101113;color:#eee;font:14px system-ui,sans-serif}header{padding:24px 5vw;border-bottom:1px solid #ffffff15;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px;letter-spacing:4px}a{color:#cbd3b4}main{max-width:1000px;margin:auto;padding:30px 24px}h1{font-size:30px;font-weight:500;margin:0 0 12px}p{color:#9d9fa8;line-height:1.7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:26px}.pane{min-width:0;border:1px solid #ffffff19;border-radius:16px;background:#16171b}.pane h2{font-size:15px;font-weight:500;margin:18px 20px 0}.pane h2 span{color:#d8f783;margin-right:12px}.pane p{font-size:12px;margin:8px 20px 0}iframe{width:100%;height:515px;border:0;display:block}.controls{max-width:720px;margin:24px auto 0;padding:24px;background:#1b1c20;border-radius:14px}.top{display:flex;justify-content:space-between;gap:12px}output{color:#d8f783;font-family:monospace}input[type=range]{width:100%;accent-color:#d8f783;margin:20px 0 8px;cursor:pointer}.labels{display:flex;justify-content:space-between;font-size:11px;color:#96979c}button{border:1px solid #ffffff25;background:#292a30;color:#eee;border-radius:8px;padding:10px 14px;cursor:pointer}button:hover{border-color:#d8f783}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}button.selected{background:#d8f783;color:#20251b}.hint{font-size:12px}.status{color:#d8f783;min-height:18px}.zone{margin-top:18px;border-radius:5px;height:6px;background:linear-gradient(to right,#8aa25d 0% 19%,#b397df 19% 31%,#8aa25d 31% 69%,#b397df 69% 81%,#8aa25d 81%)}@media(max-width:650px){main{padding:20px 10px}.pair{gap:8px}.pane h2{margin:14px 10px 0;font-size:12px}.pane p{margin:8px 10px 0;font-size:11px}iframe{height:415px}.controls{padding:18px}h1{font-size:24px}header{padding:20px}header a{font-size:11px}}@media(max-width:400px){.pair{grid-template-columns:1fr}iframe{height:415px}}</style>
<header><b>ANGLE / A:B</b><a href="http://127.0.0.1:5183/" target="_blank">打开保留的原版 ↗</a></header><main><h1>同一个角度，两种变画。</h1><p>拖动任意一张卡，两边同步。彩色扫光、照片和强度一致，只比较变画方式。</p><div class="pair"><section class="pane"><h2><span>A</span>保留版 · 柔和过渡</h2><p>较长的混合区，变化更缓。</p><iframe id="a" title="A 保留版光栅卡" src="baseline-frame.html"></iframe></section><section class="pane"><h2><span>B</span>实验版 · 清晰停留</h2><p>短角度变画，过渡时轻微折射。</p><iframe id="b" title="B 实验版光栅卡" src="experiment-frame.html"></iframe></section></div><section class="controls"><div class="top"><label for="angle">同步观看角度</label><output id="degrees">0°</output></div><input id="angle" type="range" min="-1000" max="1000" value="0"><div class="labels"><span>左侧画面 −28°</span><span>正面 0°</span><span>右侧画面 +28°</span></div><div class="zone" aria-hidden="true"></div><p class="hint">绿色：B 版清晰停留区　紫色：B 版变画区</p><div class="buttons"><button data-v="-1">左侧</button><button data-v="0">正面</button><button data-v="1">右侧</button><button data-v=".5">停在过渡中点</button><button id="auto">慢速往返</button></div><p id="phase" class="hint">B 版：清晰停留</p><div class="top"><label for="power">两边的彩色反光</label><output id="powerValue">70%</output></div><input id="power" type="range" min="0" max="100" value="70"><div class="buttons"><button id="upload">换三张照片，一起对比</button></div><input type="file" accept="image/*" multiple hidden id="files"><p class="hint">照片只在本机处理。中点仍可能短暂叠影；实验重点是缩短重影区，不用硬切线遮掩。</p><div id="status" class="status" role="status"></div></section></main><script>
const frames=[document.querySelector('#a'),document.querySelector('#b')],slider=document.querySelector('#angle');let angle=0,playing=false,animation=0,start=0,power=.7;
const send=data=>frames.forEach(f=>f.contentWindow.postMessage(data,location.origin));
function update(v){angle=Math.max(-1,Math.min(1,v));slider.value=Math.round(angle*1000);document.querySelector('#degrees').textContent=(angle>0?'+':'')+(angle*28).toFixed(1)+'°';const f=(angle+1)%1;document.querySelector('#phase').textContent=f>.38&&f<.62?'B 版：短角度变画中':'B 版：清晰停留';send({type:'angle',value:angle});}
function stop(){playing=false;cancelAnimationFrame(animation);document.querySelector('#auto').textContent='慢速往返';}
slider.oninput=e=>{stop();update(e.target.value/1000)};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{stop();update(+b.dataset.v)});
window.addEventListener('message',e=>{if(e.origin!==location.origin||!frames.some(f=>f.contentWindow===e.source))return;if(e.data.type==='drag'){stop();update(e.data.value)}if(e.data.type==='ready'){e.source.postMessage({type:'angle',value:angle},location.origin);e.source.postMessage({type:'power',value:power},location.origin)}if(e.data.type==='error')document.querySelector('#status').textContent='图片读取失败，请换用 JPG、PNG 或 WebP。';});
document.querySelector('#power').oninput=e=>{power=e.target.value/100;document.querySelector('#powerValue').textContent=e.target.value+'%';send({type:'power',value:power})};
document.querySelector('#auto').onclick=()=>{if(playing)return stop();playing=true;start=performance.now()-Math.asin(angle)*3400;document.querySelector('#auto').textContent='暂停往返';const tick=t=>{if(!playing)return;update(Math.sin((t-start)/3400));animation=requestAnimationFrame(tick)};animation=requestAnimationFrame(tick)};
document.querySelector('#upload').onclick=()=>document.querySelector('#files').click();document.querySelector('#files').onchange=async e=>{const files=[...e.target.files];if(files.length!==3){document.querySelector('#status').textContent='请一次选择三张照片。';e.target.value='';return}try{const images=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})));stop();update(0);send({type:'images',images});document.querySelector('#status').textContent='三张照片已发送到两侧预览，仅在本机处理。';}catch{document.querySelector('#status').textContent='读取失败，请重试。'}};
</script></html>
